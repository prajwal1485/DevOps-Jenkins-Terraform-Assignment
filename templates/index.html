
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Task Manager</h1>
        <p class="subtitle">Manage your daily tasks efficiently.</p>

        <form action="/add" method="POST" class="task-form">
            <input type="text" name="title" placeholder="Enter a new task..." required>
            <button type="submit">Add Task</button>
        </form>

        <h2>My Tasks</h2>

        <ul>
            {% for task in tasks %}
            <li>
                <span class="{{ 'completed' if task.completed else '' }}">
                    {{ task.title }}
                </span>

                <div class="actions">
                    <a href="/complete/{{ task.id }}" class="complete">
                        {{ 'Undo' if task.completed else 'Complete' }}
                    </a>

                    <a href="/delete/{{ task.id }}" class="delete">
                        Delete
                    </a>
                </div>
            </li>
            {% else %}
            <p>No tasks available. Add your first task!</p>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
